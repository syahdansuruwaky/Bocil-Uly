<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Website Gak Jelas 🤣</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    width:92%;
    max-width:500px;
    text-align:center;
}

.card{
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(15px);
    padding:35px 25px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.emoji{
    font-size:70px;
    animation:goyang 1s infinite;
}

@keyframes goyang{

    0%{
        transform:rotate(-10deg);
    }

    50%{
        transform:rotate(10deg);
    }

    100%{
        transform:rotate(-10deg);
    }

}

h1{
    margin:15px 0;
    font-size:32px;
}

p{
    line-height:1.6;
}

button{
    border:none;
    padding:14px 22px;
    border-radius:15px;
    margin:10px 5px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:scale(1.08);
}

.btn{
    background:white;
    color:#6045a5;
}

.btn2{
    background:#ff4757;
    color:white;
}

#hasil{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
    min-height:40px;
}

#kabur{
    position:relative;
}

.warning{
    margin-top:20px;
    font-size:13px;
    opacity:.8;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="emoji">🤨</div>

<h1>SELAMAT DATANG</h1>

<p>
Kamu telah masuk ke website yang
sebenarnya tidak penting...
</p>

<br>

<p>
Tapi karena sudah masuk,
sekarang kamu harus mengikuti peraturan. 😂
</p>

<br>

<button class="btn" onclick="mulai()">
🚀 Mulai
</button>

<div id="hasil"></div>

</div>

</div>


<script>

function mulai(){

    let hasil=document.getElementById("hasil");

    hasil.innerHTML=
    "Pertanyaan pertama... 🤔<br><br>"+
    "Apakah kamu manusia?";

    setTimeout(()=>{

        hasil.innerHTML=
        "Hmm... 🤨<br><br>"+
        "Jawabannya masih sedang diperiksa...";

    },2500);

    setTimeout(()=>{

        hasil.innerHTML=
        "HASIL PEMERIKSAAN 🧐<br><br>"+
        "Kemungkinan besar kamu manusia. 😂";

        munculTombol();

    },5000);

}


function munculTombol(){

    let hasil=document.getElementById("hasil");

    hasil.innerHTML+=`

    <br>

    <button class="btn" onclick="benar()">
    YA
    </button>

    <button
    class="btn2"
    id="kabur"
    onmouseover="kabur()">
    TIDAK
    </button>

    `;

}


function benar(){

    document.getElementById("hasil").innerHTML=
    "✅ BENAR!<br><br>"+
    "Kamu berhasil melewati tes yang sangat tidak berguna ini. 🤣<br><br>"+
    "🏆 Pencapaian terbuka:<br>"+
    "Berhasil membuang waktu 10 detik.";

}


function kabur(){

    let tombol=document.getElementById("kabur");

    let x=Math.random()*200-100;
    let y=Math.random()*150-75;

    tombol.style.transform=
    `translate(${x}px,${y}px)`;

}


/* Emoji random */

const emoji=[
    "😂",
    "🤣",
    "🤨",
    "😐",
    "🗿",
    "💀",
    "🤡",
    "🐒",
    "🐔",
    "🍌"
];

setInterval(()=>{

    let e=document.querySelector(".emoji");

    e.innerHTML=
    emoji[Math.floor(Math.random()*emoji.length)];

},1200);

</script>

</body>

</html>
